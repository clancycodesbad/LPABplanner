<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LPAB Course Planner</title>
    <link rel="preload" href="./fonts/atkinson-hyperlegible-next.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./css/planner.css">
</head>
<body>

    <!-- ─── Onboarding overlay ─────────────────────────────────────────── -->
    <div id="onboarding-overlay" role="dialog" aria-modal="true" aria-labelledby="onboarding-title" style="display:none;">
        <div class="onboarding-modal">

            <button id="onboarding-close" class="onboarding-close" aria-label="Close onboarding">&times;</button>

            <h2 id="onboarding-title" class="onboarding-modal__title"></h2>

            <div id="onboarding-tiles" class="onboarding-tiles"></div>

            <div class="onboarding-footer">
                <div class="onboarding-dots">
                    <span class="onboarding-dot"></span>
                    <span class="onboarding-dot"></span>
                    <span class="onboarding-dot"></span>
                </div>
                <div class="onboarding-footer__actions">
                    <button id="onboarding-back" class="toolbar-btn btn-print onboarding-btn">Back</button>
                    <button id="onboarding-next" class="toolbar-btn btn-export onboarding-btn">Next</button>
                </div>
            </div>

        </div>
    </div>
    <!-- ─── End onboarding overlay ──────────────────────────────────────── -->

    <aside id="subject-pool" aria-labelledby="pool-title">
        <h2 id="pool-title" class="pool__title">Subjects</h2>
        <div id="subject-list"></div>
    </aside>

    <main id="planner-board">
        <header id="progress-tracker">
            <div class="progress-header">
                <h1 class="app-title">LPAB Course Planner</h1>
                <div class="progress-toolbar">
                    <button id="export-btn" class="toolbar-btn btn-export">Copy plan</button>
                    <button id="help-btn"   class="toolbar-btn btn-help">Help</button>
                    <button id="print-btn"  class="toolbar-btn btn-print" onclick="window.print()">Print</button>
                    <button id="reset-btn"  class="toolbar-btn btn-reset">Reset plan</button>
                    <button id="theme-toggle" aria-label="Switch to dark mode">&#9790;</button>
                </div>
            </div>
            <div class="progress-rows">
                <div class="progress-row">
                    <div class="progress-row__label">
                        <span>Compulsory subjects</span> <span id="compulsory-text" class="progress-row__count">0 of 17</span>
                    </div>
                    <div class="progress-bar-bg"><div id="compulsory-bar" class="progress-bar-fill"></div></div>
                </div>
                <div class="progress-row">
                    <div class="progress-row__label">
                        <span>Electives</span> <span id="elective-text" class="progress-row__count">0 of 3</span>
                    </div>
                    <div class="progress-bar-bg"><div id="elective-bar" class="progress-bar-fill"></div></div>
                </div>
            </div>
            <p id="grad-status" role="status"></p>
        </header>

        <div id="feedback-panel" class="error"><ul id="error-list"></ul></div>

        <section class="semester-card semester-card--completed" id="completed-section">
            <div class="semester-card__label">
                <h2 class="semester-card__title">Completed</h2>
            </div>
            <div class="semester-slots semester-slots--completed" id="completed-slots" data-semester-id="completed"></div>
        </section>

        <div id="dynamic-semesters"></div>

        <footer class="app-version">
            v1.5.1 · Last updated <time datetime="2026-10-02">2 October 2026</time>
            · <a href="https://github.com/clancycodesbad/LPABplanner">Source on GitHub</a>
        </footer>
    </main>

    <script type="module" src="./js/ui/ui-main.js"></script>
    <script>
        (function () {
            const html   = document.documentElement;
            const toggle = document.getElementById('theme-toggle');

            let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            html.setAttribute('data-theme', theme);
            toggle.innerHTML = theme === 'dark' ? '&#9728;' : '&#9790;';
            toggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
            toggle.addEventListener('click', () => {
                theme = theme === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', theme);
                toggle.innerHTML = theme === 'dark' ? '&#9728;' : '&#9790;';
                toggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
            });
        })();
    </script>
</body>
</html>
